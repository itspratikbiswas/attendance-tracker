name: Keep Supabase Alive

on:
  schedule:
    # Runs at 06:00 UTC every 3 days (Mon, Thu, Sun)
    - cron: '0 6 */3 * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Secrets SUPABASE_URL or SUPABASE_ANON_KEY are missing. Please add them in GitHub Repository Settings."
            exit 1
          fi
          echo "Pinging Supabase at $SUPABASE_URL..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY" "$SUPABASE_URL/rest/v1/omniattend_user_sync?limit=1")
          echo "Supabase responded with HTTP $STATUS"
          if [ "$STATUS" -eq 200 ]; then
            echo "Success: Supabase database is active and awake!"
          else
            echo "Warning: Received HTTP $STATUS"
          fi

